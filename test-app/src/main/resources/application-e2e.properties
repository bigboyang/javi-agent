# E2E 프로파일: Redis/Kafka/RabbitMQ 연결 불가 주소로 설정해 bean 생성은 성공하되
# 실제 연결은 하지 않는다. E2E 테스트는 이 서비스들의 엔드포인트를 호출하지 않는다.

spring.datasource.url=jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.jpa.hibernate.ddl-auto=create-drop
# Hibernate 6+는 datasource에서 H2Dialect를 자동 감지하므로 명시 불필요

# Redis: non-existent port → 연결 실패하지만 bean은 생성됨
spring.data.redis.host=localhost
spring.data.redis.port=6399
spring.data.redis.timeout=200ms

# Kafka: non-existent broker + listener auto-startup 비활성
spring.kafka.bootstrap-servers=localhost:9999
spring.kafka.listener.auto-startup=false
spring.kafka.admin.fail-fast=false
spring.kafka.producer.properties.max.block.ms=100

# RabbitMQ: non-existent host + listener auto-startup 비활성
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.listener.simple.auto-startup=false
